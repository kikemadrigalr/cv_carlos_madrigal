cv:
  name: Carlos Enrique Madrigal Ramos
  headline: 'Desarrollador Backend .NET | APIs REST escalables | Testing & Full Stack Angular'
  location: Colombia
  email: carlosmad03@gmail.com
  photo:
  phone:
  website: https://github.com/kikemadrigalr/cv_carlos_madrigal
  social_networks:
    - network: LinkedIn
      username: carlosmad03
    - network: GitHub
      username: kikemadrigalr
  custom_connections:
    - placeholder: "+57 3127580552"
      url: https://wa.me/573127580552
      fontawesome_icon: phone
    # - placeholder: "+58 4227160862"
    #   url: https://wa.me/584227160862
    #   fontawesome_icon: phone
  sections:
    Perfil Profesional:
      - Desarrollador backend con 5 años de experiencia diseñando y manteniendo APIs REST robustas y escalables con .NET. Desarrollo guiado por especificaciones (PRD), con OpenAPI/Swagger como contrato de integración entre frontend y backend, y foco en código de alta calidad, refactors seguros y code reviews. Complemento con desarrollo Full Stack en Angular sobre design systems reutilizables.
      - Aseguro la confiabilidad mediante pruebas automatizadas con xUnit y dominio de SQL Server. Integro Inteligencia Artificial (Claude Code, Cursor, MCP) en el ciclo de desarrollo para acelerar entregas y elevar la calidad del código. Experiencia en modalidad remota (proyectos del sector salud y farmacéutico) y presencial (proyectos de otros sectores), con enfoque en escalabilidad y mejora continua.
    Experiencia Profesional:
      - company: TBTB Global
        position: Desarrollador Full Stack
        date: 2023 - Actualidad
        location:
        summary:
        highlights:
          - Diseño y mantenimiento de APIs REST robustas y escalables, con desarrollo guiado por especificaciones (PRD) y OpenAPI/Swagger como contrato de integración entre los equipos frontend y backend.
          - Arquitectura backend con .NET en proyectos del sector salud y farmacéutico, optimizando tiempos de respuesta y escalabilidad.
          - Implementación de pruebas automatizadas con xUnit en servicios .NET, elevando la confiabilidad y habilitando refactors complejos de forma segura.
          - Refactorización de código y code reviews como práctica continua para sostener altos estándares de calidad y mantenibilidad.
          - Modelado de bases de datos relacionales y procedimientos almacenados en SQL Server.
          - Desarrollo de interfaces web modulares en Angular (16/18) con arquitectura basada en componentes, módulos, servicios, lazy loading y un design system reutilizable, integradas a servicios .NET.
          - Integración de IA (Claude Code, Cursor, MCP) en el ciclo de desarrollo, reduciendo tiempos de entrega y mejorando la calidad del código.
      - company: Empresas Andinas
        position: Analista de Sistemas - Desarrollo
        date: 2018 - 2020
        location:
        summary:
        highlights:
          - Desarrollo de módulos para el sistema de gestión interno Galexito en .NET Framework 4.5 con ASP.NET Web Forms (páginas ASPX, controles de servidor y code-behind en C#), desplegados en IIS.
          - Creación de reportes gráficos y estructurados de indicadores con SQL Server y Reporting Services para la toma de decisiones gerenciales.
          - Automatización de la emisión de cartas de trabajo en el módulo de RRHH de Galexito, permitiendo a los empleados generar certificados laborales por sí mismos y eliminando un proceso manual.
          - Desarrollo de páginas web y mantenimiento de aplicaciones internas sobre el mismo stack.
      - company: Delegación de Deportes - Universidad de Oriente
        position: Practicas Profesionales
        date: 2016
        location:
        summary:
        highlights:
          - Analista de Sistemas
    Educación:
      - institution: Universidad de Oriente - UDO
        area: Informática
        degree: Licenciado en Informática
        date: 2019
        location: Venezuela
        summary:
    Proyectos:
      - name: DxOne — Programa de Diagnóstico LATAM
        date: 2026
        summary: Solución regional para el diagnóstico de enfermedades raras de una farmacéutica global en Colombia, México, Argentina y Chile, que engloba tres programas antes operados en plataformas independientes. Desarrollo de los módulos de Médicos, Pacientes y Red Dx en DxOne Connect (CRM web sobre TBTB Connect 2.0), sincronización con la app móvil, flujo de solicitudes diagnósticas y corrección de hallazgos en hypercare. .NET 8, Angular, SQL Server, Azure, Clean Architecture, aislamiento multi-división y cumplimiento de normativas de datos personales de los cuatro países.
      - name: TBTB Connect 2.0
        date: 2025 - 2026
        summary: Gestionar de forma integral la información operativa de clientes farmacéuticos, permitiendo registrar y supervisar actividades con médicos y pacientes, el seguimiento de procesos clínicos y la gestión completa de toma y transporte de muestras.
      - name: RDSTP
        date: 2025 - 2026
        summary: Desarrollo de un ecosistema modular (.NET + Angular) para la trazabilidad de muestras médicas, con automatización documental, validaciones inteligentes y notificaciones integradas, mejorando la eficiencia operativa en el sector salud.
      - name: RDGENPP
        date: 2024
        summary: Desarrollo de un sistema de seguimiento de muestras de pacientes para mejorar tratamientos y diagnósticos, optimizando el flujo de información entre laboratorios y centros de salud.
      - name: Galexito — Sistema de gestión interno
        date: 2018 - 2020
        summary: Módulos web para el sistema de gestión de Empresas Andinas en .NET Framework 4.5 con ASP.NET Web Forms (ASPX) y SQL Server, desplegados en IIS, incluyendo reportes gerenciales con Reporting Services y la automatización de cartas de trabajo en RRHH.
      - name: My home OI
        date: 2018 - 2020
        summary: Actualización de contenido, diseño y construcción de nuevas funcionalidades de la página web de la organización inmobiliaria My home. Con stack HTML5, CSS3, Bootstrap, JavaScript y jQuery.
    Habilidades Técnicas:
      - label: Backend
        details: "C# (paradigma OOP y tipado equivalente a Java), .NET 6–10, .NET Framework 4.5 (ASP.NET Web Forms / ASPX), ASP.NET MVC. REST API, Entity Framework. OpenAPI/Swagger como contrato de integración; desarrollo guiado por especificaciones (PRD). Python (fundamentos)."
      - label: Testing & Calidad
        details: "xUnit, pruebas unitarias y de integración, Playwright (E2E / pruebas en vivo durante el desarrollo), code reviews, refactorización, principios SOLID."
      - label: Bases de Datos
        details: "SQL Server (procedimientos almacenados, optimización, reporting), MySQL."
      - label: Frontend
        details: "Angular (14/16/18): componentes, módulos, servicios, lazy loading y design systems reutilizables. JavaScript ES6+, HTML5, CSS3, Bootstrap."
      - label: Herramientas & DevOps
        details: "GIT, Visual Studio, Postman."
    Inteligencia Artificial:
      - label: Claude Code & Cursor
        details: "Uso diario — generación de código, refactorización, debugging y documentación. Impacto: menor tiempo de entrega y mayor calidad de código."
      - label: MCP (Model Context Protocol)
        details: "Implementado en proyectos reales de TBTB para integrar IA con APIs internas de la organización. Uso del Playwright MCP para ejecutar pruebas E2E en vivo dirigidas por IA durante el desarrollo."
      - label: Gemini CLI & ChatGPT
        details: "Investigación técnica y prototipado rápido para acelerar la adopción de nuevas tecnologías."
    Cursos:
      - Curso de Claude AI · Curso de Claude Code — Platzi
      - Fundamentos de Python (Platzi) · IA para Programadores (educacionIT)
      - Curso de APIs con .NET · Fundamentos de Entity Framework — Platzi
      - Principios SOLID con C# y .NET · Fundamentos de C# con .NET — Platzi
      - Curso de ASP.NET Core · Programación Orientada a Objetos, POO — Platzi
      - SQL Basic · SQL Intermediate — HackerRank
      - Git y GitHub · Fundamentos de Javascript — Platzi
      - Curso de Frontend Developer — Platzi
    Idiomas:
      - label: Español
        details: Nativo
      - label: Inglés
        details: B1
    Datos de Interés:
      - Gran capacidad de aprendizaje autodidacta y adopción acelerada de nuevas tecnologías.
      - Experiencia en modalidades remota, presencial e híbrida, con adaptabilidad a distintos equipos y sectores.
      - Músico trompetista profesional.
