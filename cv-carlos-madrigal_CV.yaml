cv:
  name: Carlos Enrique Madrigal Ramos
  headline: Desarrollador Full Stack Angular + .NET Core + IA
  location: Colombia
  email: carlosmad03@gmail.com
  photo:
  phone:
  website: https://github.com/kikemadrigalr/cv_carlos_madrigal
  social_networks:
    - network: LinkedIn
      username: carlosmad03
    - network: GitHub
      username: kikemadrigalr
  custom_connections:
    - placeholder: "+58 4227160862"
      url: https://wa.me/573127580552
      fontawesome_icon: phone
    # - placeholder: "+58 4227160862"
    #   url: https://wa.me/584227160862
    #   fontawesome_icon: phone
  sections:
    Perfil Profesional:
      - Desarrollador Full Stack con 5 años de experiencia, especializado en backend con .NET Core y frontend con Angular. Construyo interfaces modulares sobre design systems reutilizables y diseño APIs REST, usando OpenAPI/Swagger como contrato de integración entre frontend y backend.
      - Integro Inteligencia Artificial (Claude Code, Cursor, MCP) en el ciclo de desarrollo para acelerar entregas y elevar la calidad del código. Experiencia 100% remota en proyectos del sector salud y farmacéutico, con dominio de SQL Server y enfoque en escalabilidad y mejora continua.
    Experiencia Profesional:
      - company: TBTB Global
        position: Desarrollador Full Stack
        date: 2023 - Actualidad
        location:
        summary:
        highlights:
          - Diseño de APIs REST bajo enfoque API-first / Spec Driven Development, usando OpenAPI/Swagger como contrato de integración entre los equipos frontend y backend.
          - Arquitectura backend con .NET Core en proyectos del sector salud y farmacéutico, optimizando tiempos de respuesta y escalabilidad.
          - Modelado de bases de datos relacionales y procedimientos almacenados en SQL Server.
          - Desarrollo de interfaces web modulares en Angular (16/18) con arquitectura basada en componentes, módulos, servicios, lazy loading y un design system reutilizable, integradas a servicios .NET.
          - Integración de IA (Claude Code, Cursor, MCP) en el ciclo de desarrollo, reduciendo tiempos de entrega y mejorando la calidad del código.
      - company: Empresas Andinas
        position: Analista de Sistemas - Desarrollo
        date: 2018 - 2020
        location:
        summary:
        highlights:
          - Desarrollo de módulos para sistema de gestión interno Galexito en .NET Framework 4.5.
          - Creación de reportes de indicadores con SQL Server y Reporting Services y .Net Framework.
          - Desarrollo de páginas web y mantenimiento de aplicaciones internas.
      - company: Delegación de Deportes - Universidad de Oriente
        position: Practicas Profesionales
        date: 2016
        location:
        summary:
        highlights:
          - Analista de Sistemas
    Educación:
      - institution: Universidad de Oriente - UDO
        area: Informática
        degree: Licenciado en Informática
        date: 2019
        location: Venezuela
        summary:
    Proyectos:
      - name: TBTB Connect 2.0
        date: 2025 - 2026
        summary: Gestionar de forma integral la información operativa de clientes farmacéuticos, permitiendo registrar y supervisar actividades con médicos y pacientes, el seguimiento de procesos clínicos y la gestión completa de toma y transporte de muestras.
      - name: RDSTP
        date: 2025 - 2026
        summary: Desarrollo de un ecosistema modular (.NET + Angular) para la trazabilidad de muestras médicas, con automatización documental, validaciones inteligentes y notificaciones integradas, mejorando la eficiencia operativa en el sector salud.
      - name: RDGENPP
        date: 2024
        summary: Desarrollo de un sistema de seguimiento de muestras de pacientes para mejorar tratamientos y diagnósticos, optimizando el flujo de información entre laboratorios y centros de salud.
      - name: My home OI
        date: 2018 - 2020
        summary: Actualización de contenido, diseño y construcción de nuevas funcionalidades de la página web de la organización inmobiliaria My home. Con stack HTML 5, CSS 3, Bootstrap, javascript, jquery.
      - name: Desarrollo de reportes para la toma de decisiones gerenciales
        date: 2018 - 2020
        summary: Creación de reportes gráficos y estructurados en SQL Server y Reporting Services, facilitando la visualización y análisis de información clave sobre procesos operativos.
      - name: Automatización del proceso de emisión de Cartas de Trabajo
        date: 2018
        summary: Desarrollo de un módulo en el sistema Galexito RRHH que permite a los empleados generar certificados laborales de forma automática, reduciendo tiempos y eliminando procesos manuales.
    Habilidades Técnicas:
      - label: Backend
        details: "C#, .NET Core (6/7/8), .NET Framework. REST API, Entity Framework. Spec Driven Development con OpenAPI/Swagger (API-first)."
      - label: Bases de Datos
        details: "SQL Server (procedimientos almacenados, optimización, reporting), MySQL."
      - label: Frontend
        details: "Angular (14/16/18): componentes, módulos, servicios, lazy loading y design systems reutilizables. JavaScript ES6+, HTML5, CSS3, Bootstrap."
      - label: Herramientas & DevOps
        details: "GIT, Azure DevOps, Visual Studio, Postman."
    Inteligencia Artificial:
      - label: Claude Code & Cursor
        details: "Uso diario — generación de código, refactorización, debugging y documentación. Impacto: menor tiempo de entrega y mayor calidad de código."
      - label: MCP (Model Context Protocol)
        details: "Implementado en proyectos reales de TBTB para integrar IA con APIs internas de la organización."
      - label: Gemini CLI & ChatGPT
        details: "Investigación técnica y prototipado rápido para acelerar la adopción de nuevas tecnologías."
    Cursos:
      - Curso de Claude AI - Platzi
      - Curso de Claude Code - Platzi
      - Curso Fundamentos de Python - Platzi
      - Curso IA para Programadores - educacionIT
      - Curso de APIs con .NET - Platzi
      - Fundamentos de Entity Framework - Platzi
      - Principios SOLID con C# y .NET - Platzi
      - Fundamentos de C# con NET Core - Platzi
      - Curso de ASP .NET Core - Platzi
      - SQL Basic - HackerRank
      - SQL Intermediate - HackerRank
      - Curso Profesional de Git y GitHub - Platzi
      - Fundamentos de Javascript - Platzi
      - Curso De programación Orientada a Objetos, POO - Platzi
      - Curso de Frontend Developer - Platzi
    Idiomas:
      - label: Español
        details: Nativo
      - label: Inglés
        details: B1
    Datos de Interés:
      - Gran capacidad de aprendizaje autodidacta y adopción acelerada de nuevas tecnologías.
      - Experiencia consolidada en trabajo 100% remoto y colaboración con equipos distribuidos.
      - Músico trompetista profesional.
